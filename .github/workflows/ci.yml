name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # So release.yml can require these exact checks rather than copy them.
  workflow_call:

# A second push to a PR makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that needs neither macOS nor the ~600 MB of generated data.
  checks:
    name: lint, unit tests, conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }

      # Dev tooling only — eslint. The app itself still ships zero runtime
      # dependencies; see package.json.
      - name: Install tooling
        run: npm ci

      - name: Lint
        # The SAME script the pre-commit hook runs, so "it passed locally" and
        # "it passes on the runner" cannot mean different things. Swift is
        # skipped here and checked in the macOS job below, which is where a
        # swift-format exists.
        run: tools/lint.sh

      - name: Unit tests
        # Every node suite, not a chosen two. They used to need dictionaries
        # from data/ — gitignored, and mostly commercial — so all the
        # interesting ones were left out here and quietly skipped when anyone
        # else ran them. They now generate the archives they need
        # (test/unit/fixtures/), so the runner checks what a laptop checks.
        # Not test/unit/run.sh: its renderer suite needs Electron and a display.
        run: node --test test/unit/*.test.js

      # Installs its own shellcheck, which the runner does not ship — so this
      # is the one check tools/lint.sh cannot make here (it skips shellcheck
      # when the binary is absent, and says so).
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          # Both of them: the root one arrived with the lint tooling, and ajv
          # ships shell scripts of its own that we are not going to fix.
          ignore_paths: node_modules app/node_modules

  # The Swift helper only compiles on macOS, and compiling it IS the type check
  # — there is no separate one to run.
  #
  # Formatting is deliberately NOT checked here. swift-format ships with Xcode,
  # and this runner's copy breaks lines differently from the one on a laptop —
  # measured: LiveTextEngine.swift:153, clean locally, two errors here. A gate
  # that fails on which Xcode you happen to have is one nobody can act on, so
  # swift-format runs in the pre-commit hook instead (tools/lint.sh swift).
  swift:
    name: build yomi
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: ocr/build.sh
      - name: The commands the golden harness cannot see
        # golden.sh needs test/gt/ (~200 MB, gitignored) AND is machine-local:
        # Vision's model version differs between macOS releases, so a byte-exact
        # baseline recorded on a laptop cannot be reproduced on a runner. These
        # four paths need no corpus and no permission, and they are where the
        # multi-line string literals live.
        run: |
          set -e
          ./bin/yomi --help > /dev/null
          ./bin/yomi --check-permission || true   # exits 3 without the grant
          ./bin/yomi --list-all | python3 -c 'import json,sys; json.load(sys.stdin)'
          echo "CLI paths OK"
