name: Release

# Builds the downloadable app: a bundle that runs on a machine with no
# checkout, no Xcode and no dictionary download.
#
# No dictionary is built or bundled. The app fetches or imports one from its
# settings window on first run, which removes the licensing question from the
# release entirely — there is nothing in the bundle to get wrong — and takes
# the download from ~465 MB to ~275 MB.
#
# Signing: uses a Developer ID when the secrets exist, ad-hoc when they do not.
# Ad-hoc means macOS quarantines the download and the TCC identity changes with
# every build, so Screen Recording has to be granted again after each update.
# Adding the secrets later needs no change here.

# Tagging happens HERE rather than by hand, and in the same run that publishes.
# A tag pushed with GITHUB_TOKEN does not trigger another workflow — that is a
# deliberate loop guard in Actions — so a "tag" job feeding an `on: push: tags`
# job would simply never fire. One run decides the version, builds, and creates
# the tag as part of the release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (blank = work it out from the commits)'
        required: false

permissions:
  contents: write

jobs:
  # What to call it, and whether there is anything worth releasing at all.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # tags and history, or the range is empty
      - id: next
        run: |
          set -e
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(tools/next-version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$V" = "none" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release: only docs/chore since the last tag."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Next release: $V"
          fi

  # "If CI succeeds" — the same job PRs run, called rather than copied.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    # Job level, not step level: a step's own `env:` is not in scope for that
    # step's `if:`, so `env.CERT_P12 != ''` there is always false and signing
    # would be skipped even with the secrets set.
    env:
      CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }

      - name: Import the signing certificate
        if: env.CERT_P12 != ''
        run: |
          set -e
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm /tmp/cert.p12

      - name: Build the app
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: APP_VERSION="${VERSION#v}" tools/build-release.sh

      - name: Notarize
        # Only possible with an Apple Developer account. Without it the app
        # still runs; the user clears quarantine once.
        if: env.NOTARY_KEY != ''
        run: |
          set -e
          echo "$NOTARY_KEY" | base64 --decode > /tmp/key.p8
          ditto -c -k --keepParent "/tmp/release/Yomi Overlay-darwin-arm64/Yomi Overlay.app" /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip --wait \
            --key /tmp/key.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          xcrun stapler staple "/tmp/release/Yomi Overlay-darwin-arm64/Yomi Overlay.app"
          rm /tmp/key.p8

      - name: Package
        run: |
          set -e
          mkdir -p dist
          # ditto, not zip: it preserves the symlinks and extended attributes
          # inside a .app, and a zip(1) round-trip breaks the code signature.
          ditto -c -k --keepParent \
            "/tmp/release/Yomi Overlay-darwin-arm64/Yomi Overlay.app" \
            "dist/Yomi-Overlay-${VERSION}-arm64.zip"
          cd dist && shasum -a 256 -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: Yomi-Overlay-${{ needs.version.outputs.version }}
          path: dist/

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > notes.md <<'EOF'
          Apple silicon only. Unzip into `/Applications` and launch it.

          ## First run

          macOS will refuse to open it the first time, because the build is not
          notarized: **System Settings → Privacy & Security → Open Anyway**, or

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Yomi Overlay.app"
          ```

          Then grant **Screen Recording** (required — nothing works without it)
          and **Accessibility** (optional; without it the trigger key needs a
          mouse movement to fire). The app lives in the menu bar as 読, with no
          Dock icon. Pick a target window from its Settings.

          Because the build is unsigned, macOS sees each release as a new app,
          so both permissions have to be granted again after an update.

          ## Dictionaries

          None are included — the app asks for one on first run, and the
          settings window downloads the recommended free set (Jitendex,
          JMnedict, KANJIDIC, and JPDB + BCCWJ frequency) with a button each.

          Dictionaries you own — 三省堂, 明鏡, DOJG and the rest — cannot be
          distributed with the app, so import their Yomitan `.zip` from the
          same window. They are indexed exactly like the free ones.

          Everything except lookups works before you add one: capture, OCR and
          the glyph layer do not depend on a dictionary.
          EOF
          # --target creates the tag as part of the release, so there is no
          # second push to race with, and no tag left behind if the build fails.
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
