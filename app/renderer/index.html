<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- No 'unsafe-inline' for either scripts or styles: nothing in this page is
     inline any more, so the renderer can only run code that ships with it. -->
<!-- img-src is the one thing this page loads from outside itself: the images a
     dictionary ships, served out of its own archive by main/media.js. The
     scheme is named explicitly, so a dictionary still cannot reach the network
     or the filesystem, and data: URLs remain refused. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src yomi-media:">
<title>Yomi overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="layer"></div>
  <div id="hud">overlay ready — <b>Shift</b> + point (popup stays after release)</div>
  <div id="popup"></div>
  <div id="picker"></div>

<!-- Load order matters: these are classic scripts, not modules, so each one
     must be defined before the file that uses it. popup.js owns HOW a result
     looks; renderer.js owns WHEN one shows. -->
<script src="hud.js"></script>
<script src="placement.js"></script>
<script src="glyph-layer.js"></script>
<script src="structured.js"></script>
<script src="popup.js"></script>
<!-- Sentence explanation (docs/EXPLAIN.md): the answer element is vendored
     from bot-api; picker.js and explain.js use popup.js and glyph-layer.js;
     renderer.js decides when they run. -->
<script src="../vendor/bot-answer/bot-answer.js"></script>
<script src="picker.js"></script>
<script src="explain.js"></script>
<script src="renderer.js"></script>
</body>
</html>
