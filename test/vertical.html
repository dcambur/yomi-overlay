<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #fdfcf9; height: 100%; }
  /* Tategaki as a real reader renders it: columns run right-to-left,
     characters top-to-bottom. */
  #page {
    writing-mode: vertical-rl;
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 22px;
    line-height: 2.0;
    height: 100%;
    padding: 40px 50px;
    box-sizing: border-box;
    text-align: start;
  }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 1em 0; }
  p { margin: 0 0 1em 0; }
</style></head>
<body>
  <div id="page">
    <h1>吾輩は猫である</h1>
    <p>吾輩は猫である。名前はまだ無い。</p>
    <p>どこで生れたか頓と見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。</p>
    <p>吾輩はここで始めて人間というものを見た。しかもあとで聞くとそれは書生という人間中で一番獰悪な種族であったそうだ。</p>
    <p>この書生というのは時々我々を捕えて煮て食うという話である。</p>
    <p>掌の上で少し落ちついて書生の顔を見たのがいわゆる人間というものの見始であろう。</p>
  </div>
</body></html>
